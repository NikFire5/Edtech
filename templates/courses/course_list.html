{% extends 'base.html' %}

{% block title %}Каталог курсов — SkillPulse{% endblock %}

{% block content %}
<div class="row">
    <!-- Боковая панель фильтрации -->
    <div class="col-md-3 mb-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">Фильтры</div>
            <div class="card-body">
                <form id="filter-form">
                    <div class="mb-3">
                        <label class="form-label">Поиск</label>
                        <input type="text" id="search-input" name="q" class="form-control" placeholder="Название курса...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Категория</label>
                        <select id="category-select" name="category" class="form-select">
                            <option value="">Все категории</option>
                            {% for cat in categories %}
                                <option value="{{ cat.slug }}">{{ cat.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Сетка карточек -->
    <div class="col-md-9">
        <div class="row row-cols-1 row-cols-md-2 g-4" id="courses-grid">
            {% include 'courses/includes/course_cards.html' %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const filterForm = document.getElementById('filter-form');
    const searchInput = document.getElementById('search-input');
    const categorySelect = document.getElementById('category-select');
    const coursesGrid = document.getElementById('courses-grid');

    const fetchCourses = async () => {
        const queryParams = new URLSearchParams({
            q: searchInput.value,
            category: categorySelect.value
        });

        try {
            const response = await fetch(`{% url 'courses:course_list' %}?${queryParams.toString()}`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (!response.ok) throw new Error('Ошибка сети');
            
            const data = await response.json();
            renderCourses(data.courses);
        } catch (error) {
            console.error('Fetch error:', error);
        }
    };

    const renderCourses = (courses) => {
        coursesGrid.innerHTML = '';
        if (courses.length === 0) {
            coursesGrid.innerHTML = '<div class="col-12"><p class="text-muted">Курсы не найдены.</p></div>';
            return;
        }

        courses.forEach(course => {
            const cardHTML = `
                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <span class="badge bg-info text-dark mb-2">${course.category}</span>
                            <h5 class="card-title">${course.title}</h5>
                            <p class="card-text text-muted">Автор: ${course.instructor}</p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <span class="fw-bold">${course.price} ₸</span>
                            <a href="${course.detail_url}" class="btn btn-sm btn-outline-primary">Подробнее</a>
                        </div>
                    </div>
                </div>
            `;
            coursesGrid.insertAdjacentHTML('beforeend', cardHTML);
        });
    };

    searchInput.addEventListener('input', fetchCourses);
    categorySelect.addEventListener('change', fetchCourses);
});
</script>
{% endblock %}
