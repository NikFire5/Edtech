{% extends 'base.html' %}

{% block title %}Каталог курсов — SkillPulse{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Каталог курсов</h1>
</div>

<form id="filter-form" class="filters" role="search" onsubmit="return false">
    <input type="search" id="search-input" name="q" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off">
    <select id="category-select" name="category" aria-label="Категория">
        <option value="">Все категории</option>
        {% for cat in categories %}
            <option value="{{ cat.slug }}">{{ cat.title }}</option>
        {% endfor %}
    </select>
</form>

<ul class="course-list" id="courses-grid" aria-live="polite">
    {% include 'courses/includes/course_cards.html' %}
</ul>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('search-input');
    const categorySelect = document.getElementById('category-select');
    const coursesGrid = document.getElementById('courses-grid');
    const listUrl = "{% url 'courses:course_list' %}";

    const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    const formatPrice = (value) => {
        const number = Number(value);
        return Number.isInteger(number) ? String(number) : number.toFixed(2);
    };

    let timer = null;
    let requestId = 0;

    const fetchCourses = async () => {
        const current = ++requestId;
        const params = new URLSearchParams({ q: searchInput.value, category: categorySelect.value });

        try {
            const response = await fetch(`${listUrl}?${params.toString()}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            if (!response.ok) throw new Error('Ошибка сети');
            const data = await response.json();
            if (current === requestId) renderCourses(data.courses);
        } catch (error) {
            console.error('Fetch error:', error);
        }
    };

    const renderCourses = (courses) => {
        if (courses.length === 0) {
            coursesGrid.innerHTML = `
                <li class="empty">
                    <strong>Ничего не найдено</strong>
                    Измените запрос или выберите другую категорию.
                </li>`;
            return;
        }

        coursesGrid.innerHTML = courses.map((course) => `
            <li class="course-row">
                <h3><a href="${escapeHtml(course.detail_url)}">${escapeHtml(course.title)}</a></h3>
                <span class="price">${escapeHtml(formatPrice(course.price))} ₸</span>
                <p class="desc">${escapeHtml(course.description)}</p>
                <div class="meta">
                    <span class="tag">${escapeHtml(course.category)}</span>
                    <span>${escapeHtml(course.instructor)}</span>
                </div>
            </li>
        `).join('');
    };

    searchInput.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(fetchCourses, 250);
    });
    categorySelect.addEventListener('change', fetchCourses);
});
</script>
{% endblock %}
